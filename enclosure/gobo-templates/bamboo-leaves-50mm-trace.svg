<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="50mm"
     height="50mm"
     viewBox="0 0 50 50"
     version="1.1">
  <title>Bamboo leaves 50 mm tracing template</title>
  <desc>
    Stroke-only bamboo leaf line drawing for tracing into CAD. The outer circle is
    the 50 mm aperture boundary; the dashed circle is a 2 mm edge keep-out guide.
  </desc>
  <g id="guides" fill="none">
    <circle cx="25" cy="25" r="25" stroke="#000000" stroke-width="0.25"/>
    <circle cx="25" cy="25" r="23" stroke="#808080" stroke-width="0.2"
            stroke-dasharray="1.1 0.9"/>
    <line x1="25" y1="0" x2="25" y2="50" stroke="#d0d0d0" stroke-width="0.12"/>
    <line x1="0" y1="25" x2="50" y2="25" stroke="#d0d0d0" stroke-width="0.12"/>
  </g>

  <g id="bamboo-line-art"
     fill="none"
     stroke="#000000"
     stroke-width="0.65"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path id="main-stem" d="M 13.3 43.0 C 17.2 35.8, 21.3 29.5, 26.2 23.7 C 30.0 19.2, 34.1 15.7, 39.0 12.0"/>
    <path id="secondary-stem" d="M 19.4 45.1 C 22.8 37.8, 26.1 31.3, 30.7 25.1 C 34.0 20.8, 37.2 17.4, 41.4 14.5"/>

    <path id="leaf-lower-left" d="M 19.0 34.8 C 14.0 33.5, 10.3 30.5, 8.6 26.8 C 13.2 27.0, 17.8 29.7, 21.0 33.2"/>
    <path id="leaf-mid-left" d="M 24.3 27.2 C 19.2 25.7, 15.0 22.5, 12.5 18.0 C 17.9 18.7, 22.4 21.4, 26.3 25.7"/>
    <path id="leaf-upper-left" d="M 30.2 20.2 C 25.9 18.0, 23.2 14.0, 22.8 9.7 C 27.2 11.0, 30.3 14.2, 32.2 18.8"/>

    <path id="leaf-lower-right" d="M 22.7 32.7 C 28.2 33.0, 33.7 35.5, 37.3 39.4 C 31.6 40.2, 26.5 37.9, 22.7 32.7"/>
    <path id="leaf-mid-right" d="M 27.6 25.0 C 33.7 24.0, 39.0 25.3, 43.0 29.0 C 37.2 30.8, 31.8 29.4, 27.6 25.0"/>
    <path id="leaf-upper-right" d="M 33.0 18.5 C 38.0 16.2, 42.4 15.9, 45.8 18.0 C 41.8 21.3, 36.6 22.0, 33.0 18.5"/>
  </g>
</svg>
