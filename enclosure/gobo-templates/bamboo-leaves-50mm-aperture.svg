<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="50mm"
     height="50mm"
     viewBox="0 0 50 50"
     version="1.1">
  <title>Bamboo leaves 50 mm aperture slots</title>
  <desc>
    Black shapes are intended cut-through slots for a 50 mm printed shadow aperture.
    Grey circles are reference guides only: outer diameter and 2 mm edge keep-out.
  </desc>
  <g id="guides" fill="none">
    <circle cx="25" cy="25" r="25" stroke="#000000" stroke-width="0.25"/>
    <circle cx="25" cy="25" r="23" stroke="#808080" stroke-width="0.2"
            stroke-dasharray="1.1 0.9"/>
  </g>

  <g id="cut-through-slots" fill="#000000" stroke="none">
    <!-- Narrow stem slots: approximately 0.9-1.1 mm wide. -->
    <path id="main-stem-slot"
          d="M 12.86 42.77
             C 16.79 35.48, 20.90 29.18, 25.78 23.40
             C 29.62 18.86, 33.79 15.34, 38.69 11.61
             L 39.31 12.39
             C 34.41 16.06, 30.38 19.54, 26.62 23.99
             C 21.77 29.72, 17.61 36.12, 13.74 43.23
             Z"/>
    <path id="secondary-stem-slot"
          d="M 18.94 44.91
             C 22.37 37.52, 25.73 30.98, 30.30 24.80
             C 33.63 20.42, 36.92 16.99, 41.12 14.09
             L 41.68 14.91
             C 37.48 17.81, 34.37 21.18, 31.10 25.40
             C 26.57 31.52, 23.23 38.08, 19.86 45.29
             Z"/>

    <!-- Leaf slots: almond-shaped openings sized to stay legible after projection. -->
    <path id="leaf-lower-left-slot"
          d="M 18.75 34.32
             C 14.06 33.00, 10.92 30.58, 8.88 26.74
             C 13.86 26.88, 18.05 29.78, 21.20 33.30
             C 20.40 34.02, 19.62 34.34, 18.75 34.32
             Z"/>
    <path id="leaf-mid-left-slot"
          d="M 24.10 26.78
             C 19.52 25.20, 15.42 22.25, 12.72 18.10
             C 17.96 18.60, 22.52 21.52, 26.55 25.82
             C 25.72 26.48, 24.94 26.80, 24.10 26.78
             Z"/>
    <path id="leaf-upper-left-slot"
          d="M 30.02 19.72
             C 26.15 17.78, 23.58 14.04, 23.08 9.94
             C 27.35 11.12, 30.28 14.34, 32.46 18.95
             C 31.62 19.62, 30.84 19.88, 30.02 19.72
             Z"/>
    <path id="leaf-lower-right-slot"
          d="M 22.48 32.28
             C 28.10 32.66, 33.54 35.16, 37.04 39.12
             C 31.44 39.92, 26.36 37.58, 22.48 32.28
             Z"/>
    <path id="leaf-mid-right-slot"
          d="M 27.42 24.58
             C 33.62 23.70, 38.90 25.10, 42.72 28.78
             C 37.10 30.50, 31.74 29.06, 27.42 24.58
             Z"/>
    <path id="leaf-upper-right-slot"
          d="M 32.82 18.12
             C 37.70 15.98, 42.28 15.78, 45.48 17.88
             C 41.62 21.10, 36.42 21.66, 32.82 18.12
             Z"/>
  </g>
</svg>
